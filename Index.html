<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTime | Central Timetable Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .admin-mode .admin-only { display: block !important; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-blue-700 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black tracking-tight">UNITIME <span class="font-light text-blue-200">PORTAL</span></h1>
            </div>
            <button id="admin-toggle-btn" class="bg-blue-800 hover:bg-blue-900 px-4 py-2 rounded-lg text-sm font-bold transition">
                Staff Login
            </button>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        
        <section id="admin-section" class="hidden mb-12 animate-in fade-in duration-500">
            <div class="bg-white border-2 border-blue-500 p-6 rounded-2xl shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Admin Control Panel</h2>
                    <span class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded-full">LIVE EDIT MODE</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input id="course" type="text" placeholder="Course Code (e.g. MTH 101)" class="p-3 border rounded-xl outline-blue-500">
                    <select id="dept" class="p-3 border rounded-xl outline-blue-500">
                        <option value="Computer Science">Computer Science</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Business Admin">Business Admin</option>
                        <option value="Economics">Economics</option>
                    </select>
                    <select id="level" class="p-3 border rounded-xl outline-blue-500">
                        <option value="100L">100L</option>
                        <option value="200L">200L</option>
                        <option value="300L">300L</option>
                        <option value="400L">400L</option>
                    </select>
                    <input id="day" type="text" placeholder="Day (e.g. Monday)" class="p-3 border rounded-xl outline-blue-500">
                    <input id="time" type="text" placeholder="Time (e.g. 10AM - 12PM)" class="p-3 border rounded-xl outline-blue-500">
                    <button onclick="addSchedule()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition">
                        Add to Timetable
                    </button>
                </div>
            </div>
        </section>

        <section class="mb-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div class="max-w-md w-full relative">
                    <input id="search-box" type="text" placeholder="Search by course code..." 
                           class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <span class="absolute left-4 top-4 text-gray-400">🔍</span>
                </div>
                
                <div class="flex items-center gap-3">
                    <label class="text-sm font-bold text-gray-500">Department:</label>
                    <select id="dept-filter" onchange="loadTimetable(this.value)" class="p-3 bg-white rounded-xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="All">All Departments</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Business Admin">Business Admin</option>
                        <option value="Economics">Economics</option>
                    </select>
                </div>
            </div>
        </section>

        <div id="timetable-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let isAdmin = false;

        // 2. TOGGLE ADMIN INTERFACE
        document.getElementById('admin-toggle-btn').onclick = () => {
            isAdmin = !isAdmin;
            const section = document.getElementById('admin-section');
            section.classList.toggle('hidden');
            document.body.classList.toggle('admin-mode');
            document.getElementById('admin-toggle-btn').innerText = isAdmin ? "Logout" : "Staff Login";
            document.getElementById('admin-toggle-btn').classList.toggle('bg-red-600');
        };

        // 3. ADMIN: ADD SCHEDULE
        window.addSchedule = async () => {
            const data = {
                course: document.getElementById('course').value.toUpperCase(),
                dept: document.getElementById('dept').value,
                level: document.getElementById('level').value,
                day: document.getElementById('day').value,
                time: document.getElementById('time').value,
                createdAt: new Date()
            };

            if(!data.course || !data.day || !data.time) return alert("Please fill all fields!");

            try {
                await addDoc(collection(db, "timetables"), data);
                // Clear inputs
                document.getElementById('course').value = "";
                alert("Timetable Updated!");
            } catch (e) { console.error(e); }
        };

        // 4. ADMIN: DELETE SCHEDULE
        window.deleteSchedule = async (id) => {
            if(confirm("Delete this entry?")) {
                await deleteDoc(doc(db, "timetables", id));
            }
        };

        // 5. USER & LINKED LOGIC: LOAD & FILTER
        window.loadTimetable = (selectedDept = "All") => {
            const list = document.getElementById('timetable-list');
            const searchBox = document.getElementById('search-box');
            
            let q = query(collection(db, "timetables"), orderBy("createdAt", "desc"));
            if (selectedDept !== "All") {
                q = query(collection(db, "timetables"), where("dept", "==", selectedDept), orderBy("createdAt", "desc"));
            }

            onSnapshot(q, (snapshot) => {
                const allDocs = [];
                snapshot.forEach(d => allDocs.push({ id: d.id, ...d.data() }));

                const render = (items) => {
                    list.innerHTML = items.length ? "" : "<p class='col-span-full text-center py-10 text-gray-400'>No classes scheduled.</p>";
                    items.forEach(item => {
                        list.innerHTML += `
                            <div class="bg-white p-6 rounded-2xl shadow-sm hover:shadow-md transition relative border-b-4 border-blue-500 group">
                                <button onclick="deleteSchedule('${item.id}')" class="admin-only hidden absolute top-4 right-4 text-red-400 hover:text-red-600 text-xl font-bold">✕</button>
                                <div class="flex justify-between items-start mb-4">
                                    <span class="bg-blue-50 text-blue-600 text-xs font-black px-2 py-1 rounded-md tracking-widest">${item.level}</span>
                                    <span class="text-[10px] text-gray-400 font-bold uppercase">${item.dept}</span>
                                </div>
                                <h3 class="text-xl font-bold text-gray-800 mb-2">${item.course}</h3>
                                <div class="space-y-1 text-gray-600">
                                    <p class="flex items-center gap-2"><span>📅</span> ${item.day}</p>
                                    <p class="flex items-center gap-2"><span>⏰</span> ${item.time}</p>
                                </div>
                            </div>
                        `;
                    });
                };

                render(allDocs);

                // Live Search filter
                searchBox.oninput = (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = allDocs.filter(doc => doc.course.toLowerCase().includes(term));
                    render(filtered);
                };
            });
        };

        // Run on start
        loadTimetable("All");
    </script>
</body>
</html>
